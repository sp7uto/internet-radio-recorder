name: Import IRR documentation artwork

on:
  push:
    paths:
      - .github/workflows/import-irr-artwork.yml

permissions:
  contents: write

jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and validate images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/images
          curl --fail --location --retry 3 --max-time 120 \
            'https://lh3.googleusercontent.com/pw/AP1GczOqcsyF5Rs2ZtRydlQZtXwY0vSgBL9SUJ-lxjPgC7s2dPEhaeKChQNHBGXQsNs5jMrkiz4ACpgEMVHDZaR1HbQC4BfwkgpnOQxJwh3L9lYijl1YMPzm=w1600' \
            --output docs/images/irr-header.jpg
          curl --fail --location --retry 3 --max-time 120 \
            'https://lh3.googleusercontent.com/pw/AP1GczMpFfgpSg5MFwkl6plNhU9WvEjpZSfKTKJhRgi0BurHKIXvoEoel71IlYdIudglNqRmVXjd71lsAZ_Zj8LKj0oAHOAoTiOHaaf-GCiNPmRPLF3eRpfO=w1600' \
            --output docs/images/irr-footer.jpg
          for image in docs/images/irr-header.jpg docs/images/irr-footer.jpg; do
            test "$(wc -c < "$image")" -gt 10000
            file "$image" | grep -qi 'JPEG image'
          done

      - name: Point README and wiki source pages to repository assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base='https://raw.githubusercontent.com/sp7uto/internet-radio-recorder/main/docs/images/'
          pages=['README.md','README.pl.md','wiki/Home.md','wiki/Home-PL.md']
          for name in pages:
              path=Path(name)
              content=path.read_text(encoding='utf-8')
              for marker, asset in [
                  ('Internet Radio Recorder — grafika otwierająca', 'irr-header.jpg'),
                  ('Internet Radio Recorder — grafika końcowa', 'irr-footer.jpg')
              ]:
                  pattern=r'(<img src=")[^"]+(" alt="'+re.escape(marker)+r'")'
                  content,count=re.subn(pattern,lambda m:m.group(1)+base+asset+m.group(2),content)
                  if count!=1:
                      raise SystemExit(f'{name}: expected exactly one image for {marker}, found {count}')
              path.write_text(content,encoding='utf-8')
          PY

      - name: Commit artwork and local links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/irr-header.jpg docs/images/irr-footer.jpg README.md README.pl.md wiki/Home.md wiki/Home-PL.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: store IRR artwork in repository and update references'
            git push
          fi
