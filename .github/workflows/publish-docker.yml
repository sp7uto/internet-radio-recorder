name: Publish Docker image

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, e.g. v2.2.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Validate version and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$VERSION"
          gh release view "$TAG" >/dev/null
          LATEST="$(gh release view --json tagName --jq .tagName)"
          test "$TAG" = "$LATEST" || { echo "Not the latest stable release ($LATEST)" >&2; exit 1; }
      - name: Install and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q recorder.py api.py schedules.py tests
          python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish stable and version tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/sp7uto/internet-radio-recorder:${{ inputs.release_tag }}
            ghcr.io/sp7uto/internet-radio-recorder:stable
          labels: |
            org.opencontainers.image.source=https://github.com/sp7uto/internet-radio-recorder
            org.opencontainers.image.version=${{ inputs.release_tag }}
