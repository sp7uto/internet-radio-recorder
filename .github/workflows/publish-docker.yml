name: Publish Docker image

# Push on the workflow itself bootstraps/revalidates the latest stable image.
# Future VERSION changes publish via the reusable call from release.yml.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, e.g. v2.2.1'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-docker.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: irr-ghcr-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          TAG="${REQUESTED_TAG:-$LATEST}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "$LATEST" || { echo "Refusing non-latest release: $TAG (latest: $LATEST)" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate version and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$TAG" = "v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Install and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q recorder.py api.py schedules.py tests
          python -m unittest discover -s tests -v

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable and version tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/sp7uto/internet-radio-recorder:${{ steps.release.outputs.tag }}
            ghcr.io/sp7uto/internet-radio-recorder:stable
          labels: |
            org.opencontainers.image.source=https://github.com/sp7uto/internet-radio-recorder
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
