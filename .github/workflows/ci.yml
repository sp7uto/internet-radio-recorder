name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q recorder.py api.py schedules.py tests
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify updater guard and shell syntax
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          bash -n deploy/irr-docker-update deploy/install-vps.sh
      - name: Build Docker image
        run: docker build -t internet-radio-recorder:ci .
