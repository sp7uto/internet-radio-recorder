name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q recorder.py web.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build -t internet-radio-recorder:ci .
