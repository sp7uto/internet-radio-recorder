name: Repaint screenshot version (temporary)

on:
  push:
    branches:
      - docs/screenshots-v221-20261026
    paths:
      - .github/workflows/refresh-screenshots-temporary.yml
      - tools/refresh_screenshot_versions.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Repaint only old screenshot version badges
        run: python tools/refresh_screenshot_versions.py
      - name: Validate images and publish to same branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in sorted(Path("docs/screenshots").glob("IRR0*.png")):
              with Image.open(path) as im:
                  assert im.format == "PNG" and im.width > 500
                  print(path, im.size, im.format)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/IRR0*.png
          git diff --cached --check
          git diff --cached --quiet || {
            git commit -m "docs: update six screenshot labels to v2.2.1"
            git push origin HEAD:docs/screenshots-v221-20261026
          }
